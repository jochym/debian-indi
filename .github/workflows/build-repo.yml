name: Build & Deploy APT Repository

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to use (default: latest)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REPO_ORIGIN: INDI Debian & Ubuntu
  REPO_LABEL: INDI APT Repository
  REPO_ARCHITECTURES: "arm64 amd64"
  REPO_COMPONENT: main

jobs:
  repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    container:
      image: debian:trixie-slim
    steps:
      - name: Install tools
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            dpkg-dev apt-utils git gnupg curl jq ca-certificates

      - name: Configure apt for quiet mode
        run: |
          cat > /etc/apt/apt.conf.d/99opencode-quiet <<'EOF'
          APT::Get::Quiet "2";
          Dpkg::Progress-Fancy "0";
          quiet "true";
          EOF

      - name: Determine release tag
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            echo "No tag specified, finding latest release..."
            TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" | \
              jq -r '.tag_name // empty')
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "::error::No releases found!"
              exit 1
            fi
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "Using versioned release: $TAG"

      - name: Download .deb packages from versioned Release and sort by distro
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          API="https://api.github.com/repos/${{ github.repository }}"
          DOWNLOAD_BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"

          mkdir -p /tmp/all_debs
          mkdir -p repo-site/pool/bookworm/main
          mkdir -p repo-site/pool/trixie/main
          mkdir -p repo-site/pool/noble/main
          mkdir -p repo-site/pool/resolute/main

          echo "Fetching asset list for $TAG..."
          curl -s -H "Authorization: token $TOKEN" \
            "$API/releases/tags/$TAG" | jq -r '.assets[]? | .name' > /tmp/all_assets.txt

          COUNT=$(wc -l < /tmp/all_assets.txt)
          echo "Found $COUNT assets"
          export DOWNLOAD_BASE
          xargs -P 4 -I {} -a /tmp/all_assets.txt \
            sh -c 'curl -s -L -o "/tmp/all_debs/{}" "$DOWNLOAD_BASE/{}"'

          # Sort packages into per-distribution pool directories
          for deb in /tmp/all_debs/*.deb; do
            [ -f "$deb" ] || continue
            filename=$(basename "$deb")
            if [[ "$filename" =~ (~|_)noble ]]; then
              cp "$deb" repo-site/pool/noble/main/
            elif [[ "$filename" =~ (~|_)resolute ]]; then
              cp "$deb" repo-site/pool/resolute/main/
            elif [[ "$filename" =~ (~|_)bookworm ]]; then
              cp "$deb" repo-site/pool/bookworm/main/
            elif [[ "$filename" =~ (~|_)trixie ]] || [[ "$filename" =~ (~|_)stable ]] || [[ "$filename" =~ (~|_)deb ]]; then
              cp "$deb" repo-site/pool/trixie/main/
            else
              # Default/fallback to trixie
              cp "$deb" repo-site/pool/trixie/main/
            fi
          done

          echo "Bookworm pool count: $(ls repo-site/pool/bookworm/main | wc -l)"
          echo "Trixie pool count:   $(ls repo-site/pool/trixie/main | wc -l)"
          echo "Noble pool count:    $(ls repo-site/pool/noble/main | wc -l)"
          echo "Resolute pool count: $(ls repo-site/pool/resolute/main | wc -l)"

      - name: Generate repository indices for all distributions
        run: |
          CODENAMES="bookworm trixie noble resolute"
          ARCHS="arm64 amd64"

          for codename in $CODENAMES; do
            echo "--- Generating indices for $codename ---"
            for arch in $ARCHS; do
              mkdir -p "repo-site/dists/${codename}/${REPO_COMPONENT}/binary-${arch}"

              # Generate Packages file for this arch
              cd repo-site
              apt-ftparchive --arch "$arch" packages "pool/${codename}/${REPO_COMPONENT}" > "dists/${codename}/${REPO_COMPONENT}/binary-${arch}/Packages"
              gzip -fk "dists/${codename}/${REPO_COMPONENT}/binary-${arch}/Packages"
              echo "${REPO_COMPONENT}" > "dists/${codename}/${REPO_COMPONENT}/binary-${arch}/Components"
              cd ..
            done

            # Generate Release configuration
            cat > "apt-release-${codename}.conf" <<EOF
          APT::FTPArchive::Release::Origin "${REPO_ORIGIN}";
          APT::FTPArchive::Release::Label "${REPO_LABEL}";
          APT::FTPArchive::Release::Suite "${codename}";
          APT::FTPArchive::Release::Codename "${codename}";
          APT::FTPArchive::Release::Architectures "${REPO_ARCHITECTURES}";
          APT::FTPArchive::Release::Components "${REPO_COMPONENT}";
          APT::FTPArchive::Release::Description "INDI repository for ${codename}";
          EOF
            sed -i 's/^[ \t]*//' "apt-release-${codename}.conf"

            cd repo-site
            apt-ftparchive release -c "../apt-release-${codename}.conf" "dists/${codename}" > "dists/${codename}/Release"
            cd ..
          done

          # Create 'stable' alias/mirror matching trixie for backwards compatibility
          mkdir -p repo-site/dists/stable/${REPO_COMPONENT}
          cp -r repo-site/dists/trixie/${REPO_COMPONENT}/* repo-site/dists/stable/${REPO_COMPONENT}/
          cat > apt-release-stable.conf <<EOF
          APT::FTPArchive::Release::Origin "${REPO_ORIGIN}";
          APT::FTPArchive::Release::Label "${REPO_LABEL}";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "stable";
          APT::FTPArchive::Release::Architectures "${REPO_ARCHITECTURES}";
          APT::FTPArchive::Release::Components "${REPO_COMPONENT}";
          APT::FTPArchive::Release::Description "INDI repository for Debian stable";
          EOF
          sed -i 's/^[ \t]*//' apt-release-stable.conf

          cd repo-site
          apt-ftparchive release -c ../apt-release-stable.conf dists/stable > dists/stable/Release
          cd ..

      - name: Import GPG key and sign repositories
        if: env.HAS_GPG_KEY == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "${GPG_PRIVATE_KEY}" | gpg --import --batch --yes

          # Extract full 40-char fingerprint from fpr: record
          KEY_FPR=$(gpg --list-keys --with-colons | grep '^fpr:' | head -1 | cut -d: -f10)
          echo "Using key fingerprint: ${KEY_FPR}"

          # Export public key for users
          gpg --export --armor "${KEY_FPR}" > repo-site/gpg_public_key.asc

          CODENAMES="bookworm trixie noble resolute stable"
          for codename in $CODENAMES; do
            if [ -d "repo-site/dists/${codename}" ]; then
              cd "repo-site/dists/${codename}"
              # InRelease (clear-signed) - preferred by modern APT
              gpg --trust-model always --clearsign --digest-algo SHA256 \
                --local-user "${KEY_FPR}" \
                --output InRelease Release
              # Release.gpg (detached signature) - for older APT
              gpg --trust-model always --armor --detach-sign \
                --local-user "${KEY_FPR}" \
                --output Release.gpg Release
              cd ../..
            fi
          done

      - name: Create index.html
        run: |
          cat > repo-site/index.html <<'ENDOFFILE'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>INDI APT Repository (unofficial)</title>
          <style>
            body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; color: #1a1a1a; }
            code { background: #f4f4f4; padding: 0.2em 0.4em; border-radius: 4px; font-size: 0.9em; }
            pre { background: #1e1e1e; color: #d4d4d4; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.9em; }
            .btn { display: inline-block; background: #0366d6; color: white; padding: 0.5rem 1rem; border-radius: 4px; text-decoration: none; font-weight: 500; }
            .btn:hover { background: #0256b3; }
            .distro-card { border: 1px solid #e1e4e8; border-radius: 6px; padding: 1.2rem; margin: 1rem 0; background: #fafbfc; }
            h2, h3 { border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
          </style>
          </head>
          <body>
          <h1>INDI APT Repository (unofficial)</h1>

          <p>Community-maintained repository for <strong>INDI Library</strong> and 3rd-party drivers, built for <strong>Debian and Ubuntu</strong>. Automatically compiled from upstream tags at <code>indilib/indi</code> and <code>indilib/indi-3rdparty</code>.</p>
          <p><strong>Note:</strong> This is an independent, unofficial repository with no affiliation to the astroberry project or the upstream INDI organization.</p>

          <h2>GPG Key</h2>
          <p>Public key for verifying repository signatures:</p>
          <p><a href="/gpg_public_key.asc" class="btn">Download public key (ASCII armor)</a></p>
          <pre>curl -fsSL https://jochym.github.io/debian-indi/gpg_public_key.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/debian-indi.gpg</pre>

          <h2>Adding the Repository</h2>
          <p>Run the following command to automatically detect your Debian or Ubuntu release and add the repository:</p>
          <pre>. /etc/os-release && echo "deb [signed-by=/etc/apt/trusted.gpg.d/debian-indi.gpg] https://jochym.github.io/debian-indi/ ${VERSION_CODENAME} main" | sudo tee /etc/apt/sources.list.d/debian-indi.list</pre>

          <p><em>Supports <strong>Debian</strong> (<code>bookworm</code>, <code>trixie</code>) and <strong>Ubuntu</strong> (<code>noble</code>, <code>resolute</code>).</em></p>

          <h3>Installation</h3>
          <pre>sudo apt update
          sudo apt install indi-3rdparty-drivers</pre>

          <h2>Available Packages</h2>
          <ul>
          <li><strong>indi-bin</strong>, <strong>libindi1</strong>, <strong>libindi-dev</strong>, <strong>libindi-data</strong> – core INDI Library</li>
          <li><strong>indi-3rdparty-libs</strong> – meta-package for 3rd-party libraries</li>
          <li><strong>indi-3rdparty-drivers</strong> – meta-package for all 3rd-party drivers (Recommends all <code>indi-*</code>)</li>
          <li>Drivers: <code>indi-eqmod</code>, <code>indi-gphoto</code>, <code>indi-asi</code>, <code>indi-qhy</code>, <code>indi-sbig</code>, <code>indi-playerone</code>, and more</li>
          </ul>
          <p>Individual packages can also be downloaded from the <a href="https://github.com/jochym/debian-indi/releases/latest">GitHub Releases page</a>.</p>

          <h2>Supported Architectures</h2>
          <p><strong>amd64</strong> (x86_64) and <strong>arm64</strong> (aarch64 – Raspberry Pi 4/5, Orange Pi, Rock Pi, etc.)</p>

          <h2>Updates</h2>
          <p>Repository is refreshed automatically when upstream releases are published. Versions are always synchronized with <code>indilib/indi</code> and <code>indilib/indi-3rdparty</code>.</p>

          <hr>
          <p><small>Automatically built by GitHub Actions. Sources: <a href="https://github.com/indilib/indi">indilib/indi</a>, <a href="https://github.com/indilib/indi-3rdparty">indilib/indi-3rdparty</a>.</small></p>
          </body>
          </html>
          ENDOFFILE
          # Strip 10 leading spaces added for YAML indentation
          sed -i 's/^[ ]\{10\}//' repo-site/index.html

      - name: Deploy to gh-pages (history pruning)
        run: |
          cd repo-site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "Automated update of INDI APT repository (history pruned)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin gh-pages --force

  trigger-test:
    needs: [repo]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - run: |
          gh workflow run "Test APT Repository" --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
