name: Build 3rd Party Libs and Drivers

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_FRONTEND: noninteractive

jobs:
  build-3rdparty-drivers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro_id: debian-bookworm
            distro_name: Debian 12 (Bookworm)
            distro_type: debian
            codename: bookworm
            image: debian:bookworm-slim
            arch: arm64
            runner: ubuntu-24.04-arm
          - distro_id: debian-bookworm
            distro_name: Debian 12 (Bookworm)
            distro_type: debian
            codename: bookworm
            image: debian:bookworm-slim
            arch: amd64
            runner: ubuntu-latest
          - distro_id: debian-trixie
            distro_name: Debian 13 (Trixie)
            distro_type: debian
            codename: trixie
            image: debian:trixie-slim
            arch: arm64
            runner: ubuntu-24.04-arm
          - distro_id: debian-trixie
            distro_name: Debian 13 (Trixie)
            distro_type: debian
            codename: trixie
            image: debian:trixie-slim
            arch: amd64
            runner: ubuntu-latest
          - distro_id: ubuntu-noble
            distro_name: Ubuntu 24.04 LTS (Noble)
            distro_type: ubuntu
            codename: noble
            image: ubuntu:noble
            arch: arm64
            runner: ubuntu-24.04-arm
          - distro_id: ubuntu-noble
            distro_name: Ubuntu 24.04 LTS (Noble)
            distro_type: ubuntu
            codename: noble
            image: ubuntu:noble
            arch: amd64
            runner: ubuntu-latest
          - distro_id: ubuntu-resolute
            distro_name: Ubuntu 26.04 LTS (Resolute)
            distro_type: ubuntu
            codename: resolute
            image: ubuntu:resolute
            arch: arm64
            runner: ubuntu-24.04-arm
          - distro_id: ubuntu-resolute
            distro_name: Ubuntu 26.04 LTS (Resolute)
            distro_type: ubuntu
            codename: resolute
            image: ubuntu:resolute
            arch: amd64
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Configure apt for quiet mode
        run: |
          cat > /etc/apt/apt.conf.d/99opencode-quiet <<'EOF'
          APT::Get::Quiet "2";
          Dpkg::Progress-Fancy "0";
          quiet "true";
          EOF

      - name: Configure package repositories
        run: |
          if [ "${{ matrix.distro_type }}" = "ubuntu" ]; then
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sed -i 's/Components: main restricted/Components: main restricted universe multiverse/' /etc/apt/sources.list.d/ubuntu.sources || true
              sed -i 's/Components: main/Components: main restricted universe multiverse/' /etc/apt/sources.list.d/ubuntu.sources || true
            fi
            if [ -f /etc/apt/sources.list ]; then
              sed -i 's/main restricted$/main restricted universe multiverse/' /etc/apt/sources.list || true
              sed -i 's/main$/main restricted universe multiverse/' /etc/apt/sources.list || true
            fi
          elif [ "${{ matrix.distro_type }}" = "debian" ]; then
            if [ -f /etc/apt/sources.list.d/debian.sources ]; then
              sed -i 's/Components: main/Components: main contrib non-free non-free-firmware/' /etc/apt/sources.list.d/debian.sources || sed -i 's/Components: main/Components: main contrib non-free/' /etc/apt/sources.list.d/debian.sources || true
            fi
            if [ -f /etc/apt/sources.list ]; then
              sed -i 's/main$/main contrib non-free non-free-firmware/' /etc/apt/sources.list || sed -i 's/main$/main contrib non-free/' /etc/apt/sources.list || true
            fi
          fi

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y git ca-certificates build-essential curl jq dpkg-dev devscripts equivs

      - name: Detect upstream release version
        run: |
          UPSTREAM_TAG=$(curl -s https://api.github.com/repos/indilib/indi-3rdparty/releases/latest | jq -r .tag_name)
          VERSION=$(echo "$UPSTREAM_TAG" | sed 's/^v//')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to fetch version from GitHub API. Using default version: 2.2.2.1"
            VERSION="2.2.2.1"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Detected package version: $VERSION"

      - name: Checkout INDI 3rdparty sources
        uses: actions/checkout@v6
        with:
          repository: 'indilib/indi-3rdparty'
          ref: refs/tags/v${{ env.VERSION }}
          path: '3rdparty'

      - name: Download core packages (${{ matrix.distro_id }}-${{ matrix.arch }})
        uses: dawidd6/action-download-artifact@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: alt-indi-core.yml
          name: indi-compiled-packages-${{ matrix.distro_id }}-${{ matrix.arch }}
          workflow_conclusion: success
          path: ./pre-built-core

      - name: Install core packages
        run: |
          DEBS=$(find ./pre-built-core -name "*.deb" -not -name "*dbg*" | tr '\n' ' ')
          apt-get install -y --no-install-recommends $DEBS

      - name: Inject build version into driver changelogs
        run: |
          BUILD_TAG=$(date +%Y%m%d)-r${{ github.run_number }}
          for cl in 3rdparty/debian/*/changelog; do
            [ -f "$cl" ] || continue
            sed -i "1s/)/+ab${BUILD_TAG}~${{ matrix.codename }})/" "$cl"
          done
          echo "Patched changelogs with +ab${BUILD_TAG}~${{ matrix.codename }}"

      - name: Build and install all libraries
        run: |
          exec 3>&1 4>&2
          BUILD_LOG="$GITHUB_WORKSPACE/build-libraries.log"
          : > "$BUILD_LOG"
          exec >> "$BUILD_LOG" 2>&1
          cd 3rdparty
          for lib in lib* ; do
            control_file=debian/$lib/control
            [ -e "$control_file" ] || [ -e "$lib/debian/control" ] || continue
            
            echo "::info:: $lib: Installing build dependencies via mk-build-deps"
            
            # Force non-interactive frontend and handle mk-build-deps execution
            if ! DEBIAN_FRONTEND=noninteractive mk-build-deps -i -r \
               -t "apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends -y" \
               "$control_file"; then
              
              # Temporarily restore stdout/stderr to log the error to the GitHub Actions UI
              exec 1>&3 2>&4
              echo "::error::$lib: failed to install build dependencies via mk-build-deps"
              
              if [ -f "$BUILD_LOG" ]; then
                echo "::group::Recent installation log entries for $DRIVER_NAME"
                tail -n 20 "$BUILD_LOG" >&3
                echo "::endgroup::"
              fi
              
              # Redirect back to build log and proceed with the next package
              exec >> "$BUILD_LOG" 2>&1
              continue
            fi
            
            # Detect and install build deps
            # mk-build-deps -i -r -t "apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends -y" "debian/$lib/control"

            if ./scripts/indi-3rdparty-deb.sh "$lib"; then
              :
            else
              exec 1>&3 2>&4
              echo "::error::$lib: FAILED"
              tail -10 "$BUILD_LOG" >&3
              exec >> "$BUILD_LOG" 2>&1
            fi
          done
          if [ -d "build" ] && ls build/lib*.deb >/dev/null 2>&1; then
            apt-get install -y -o Dpkg::Options::="--force-overwrite" ./build/lib*.deb
          fi
          exec 1>&3 2>&4

      - name: Build drivers
        run: |
          exec 3>&1 4>&2
          BUILD_LOG="$GITHUB_WORKSPACE/build-drivers.log"
          : > "$BUILD_LOG"
          exec >> "$BUILD_LOG" 2>&1
          cd 3rdparty
          for driver in indi-* ; do
            control_file=debian/$driver/control
            [ -e "$control_file" ] || continue
            DRIVER_NAME=$driver
            
            echo "::info:: $driver: Installing build dependencies via mk-build-deps"
            
            # Force non-interactive frontend and handle mk-build-deps execution
            if ! DEBIAN_FRONTEND=noninteractive mk-build-deps -i -r \
               -t "apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends -y" \
               "$control_file"; then
              
              # Temporarily restore stdout/stderr to log the error to the GitHub Actions UI
              exec 1>&3 2>&4
              echo "::error::$DRIVER_NAME: failed to install build dependencies via mk-build-deps"
              
              if [ -f "$BUILD_LOG" ]; then
                echo "::group::Recent installation log entries for $DRIVER_NAME"
                tail -n 20 "$BUILD_LOG" >&3
                echo "::endgroup::"
              fi
              
              # Redirect back to build log and proceed with the next package
              exec >> "$BUILD_LOG" 2>&1
              continue
            fi
            
            # Detect and install build deps
            # mk-build-deps -i -r -t "apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends -y" "debian/$driver/control"

            RAW_DEPS=$(dpkg-checkbuilddeps "$control_file" 2>&1 | \
                        sed -E 's/^.*unmet build dependencies:\s*//Ii' | \
                        sed -e 's/([^)]*)//g' -e 's/,//g')
            if [ -z "$RAW_DEPS" ]; then
              :
            else
              case "$RAW_DEPS" in
                *błąd*|*error*|*Error*|*Błąd*)
                  exec 1>&3 2>&4
                  echo "::error::$DRIVER_NAME: corrupted control file or dpkg error"
                  exec >> "$BUILD_LOG" 2>&1
                  continue
                  ;;
              esac
              DEBS_TO_INSTALL=""
              FATAL_ERROR=0
              MISSING_FATAL_PACKAGES=""
              for package in $RAW_DEPS; do
                if apt-cache policy "$package" | grep -q "Candidate: [^ ]"; then
                  DEBS_TO_INSTALL="$DEBS_TO_INSTALL $package"
                else
                  FATAL_ERROR=1
                  MISSING_FATAL_PACKAGES="$MISSING_FATAL_PACKAGES $package"
                fi
              done
              if [ "$FATAL_ERROR" -eq 1 ]; then
                exec 1>&3 2>&4
                echo "::error::$DRIVER_NAME: missing packages: $MISSING_FATAL_PACKAGES"
                exec >> "$BUILD_LOG" 2>&1
                continue
              fi
              if [ ! -z "$DEBS_TO_INSTALL" ]; then
                apt-get install -y $DEBS_TO_INSTALL
              fi
            fi
            if ./scripts/indi-3rdparty-deb.sh "$DRIVER_NAME"; then
              :
            else
              exec 1>&3 2>&4
              echo "::error::$DRIVER_NAME: FAILED"
              tail -10 "$BUILD_LOG" >&3
              exec >> "$BUILD_LOG" 2>&1
              continue
            fi
          done
          exec 1>&3 2>&4

      - name: Upload compiled packages (${{ matrix.distro_id }}-${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: 3rdparty-compiled-packages-${{ matrix.distro_id }}-${{ matrix.arch }}
          path: |
            3rdparty/build/*.deb
          retention-days: 14
          if-no-files-found: error

      - name: Upload build logs (${{ matrix.distro_id }}-${{ matrix.arch }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-3rdparty-log-${{ matrix.distro_id }}-${{ matrix.arch }}
          path: |
            build-libraries.log
            build-drivers.log
          retention-days: 30

  trigger-meta:
    needs: [build-3rdparty-drivers]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - run: |
          gh workflow run indi-3rdparty-meta.yml --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
